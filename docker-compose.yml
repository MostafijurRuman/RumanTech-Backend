services:
  postgres:
    image: postgres:16-alpine
    container_name: rumantech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rumantech
    ports:
      - "5432:5432"
    volumes:
      - rumantech-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rumantech"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rumantech-postgres-data:
